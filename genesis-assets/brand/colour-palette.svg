<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Title -->
  <text x="500" y="40" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#1a1d21" text-anchor="middle">Genesis Colour Palette</text>
  
  <!-- Primary Colours Row -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#9a968f">PRIMARY</text>
  
  <rect x="50" y="110" width="120" height="120" fill="#1a1d21"/>
  <text x="110" y="250" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Charcoal Deep</text>
  <text x="110" y="265" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#1a1d21</text>
  
  <rect x="190" y="110" width="120" height="120" fill="#f8f7f4" stroke="#eeece7"/>
  <text x="250" y="250" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Cream</text>
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#f8f7f4</text>
  
  <rect x="330" y="110" width="120" height="120" fill="#4a7c7c"/>
  <text x="390" y="250" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Teal</text>
  <text x="390" y="265" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#4a7c7c</text>
  
  <!-- Secondary Colours Row -->
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#9a968f">SECONDARY</text>
  
  <rect x="50" y="340" width="120" height="120" fill="#2a2d31"/>
  <text x="110" y="480" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Charcoal</text>
  <text x="110" y="495" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#2a2d31</text>
  
  <rect x="190" y="340" width="120" height="120" fill="#eeece7"/>
  <text x="250" y="480" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Cream Dark</text>
  <text x="250" y="495" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#eeece7</text>
  
  <rect x="330" y="340" width="120" height="120" fill="#9a968f"/>
  <text x="390" y="480" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Warm Grey</text>
  <text x="390" y="495" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#9a968f</text>
  
  <!-- System Colours Row -->
  <text x="550" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#9a968f">VERDICTS</text>
  
  <rect x="550" y="110" width="100" height="100" fill="#4a7c5c"/>
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Pass</text>
  <text x="600" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#4a7c5c</text>
  
  <rect x="670" y="110" width="100" height="100" fill="#8c5a5a"/>
  <text x="720" y="230" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Fail</text>
  <text x="720" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#8c5a5a</text>
  
  <rect x="790" y="110" width="100" height="100" fill="#7c6f4a"/>
  <text x="840" y="230" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Coincidence</text>
  <text x="840" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#7c6f4a</text>
  
  <rect x="550" y="280" width="100" height="100" fill="#9a968f"/>
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="11" fill="#1a1d21" text-anchor="middle">Uncertain</text>
  <text x="600" y="415" font-family="Arial, sans-serif" font-size="10" fill="#9a968f" text-anchor="middle">#9a968f</text>
  
  <!-- Typography Note -->
  <text x="550" y="480" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#9a968f">TYPOGRAPHY</text>
  <text x="550" y="510" font-family="Georgia, serif" font-size="16" fill="#1a1d21">Fraunces — Display</text>
  <text x="550" y="540" font-family="Arial, sans-serif" font-size="14" fill="#1a1d21">DM Sans — Body</text>
</svg>
